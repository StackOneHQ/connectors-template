  - actionId: create_employee_leave_request
    categories:
      - hris
    actionType: create
    label: Create Employee Leave Request
    description: Create a leave request for a specific employee
    details: "Creates a new employee in BreatheHR. Requires first_name, last_name, and email. Supports optional fields including employment_status, department_id, location_id, division_id, job_title, start_date, and other employee properties. Returns the created employee with ID and all properties."
    inputs:
      - name: id
        description: ID of employee to create leave request for.
        type: number
        in: path
        required: true
      - name: exclude_cancelled_requests
        description: Don't return cancelled leave requests.
        type: boolean
        in: body
        required: false
      - name: leave_request[start_date]
        description: Start date of the leave request.
        type: string
        in: body
        required: true
      - name: leave_request[end_date]
        description: End date of the leave request.
        type: string
        in: body
        required: true
      - name: leave_request[half_start]
        description: Whether the start date is a half day.
        type: boolean
        in: body
        required: true
      - name: leave_request[half_start_am_pm]
        description: Whether the half start day is AM or PM.
        type: string
        in: body
        required: false
      - name: leave_request[half_end]
        description: Whether the end date is a half day.
        type: boolean
        in: body
        required: false
      - name: leave_request[half_end_am_pm]
        description: Whether the half end day is AM or PM.
        type: string
        in: body
        required: false
      - name: leave_request[type]
        description: Type of leave request.
        type: string
        in: body
        required: false
      - name: leave_request[notes]
        description: Notes for the leave request.
        type: string
        in: body
        required: false
    steps:
      - stepId: create_leave_request
        description: Create employee leave request
        stepFunction:
          functionName: request
          parameters:
            url: /employees/${inputs.id}/leave_requests
            method: post
            args:
              - name: X-Api-Key
                value: $.credentials.apiKey
                in: headers
              - name: Content-Type
                value: application/x-www-form-urlencoded
                in: headers
              - name: exclude_cancelled_requests
                value: '{{$.inputs.exclude_cancelled_requests}}'
                in: body
                condition: '{{present($.inputs.exclude_cancelled_requests)}}'
              - name: leave_request[start_date]
                value: "{{$.inputs['leave_request[start_date]']}}"
                in: body
              - name: leave_request[end_date]
                value: "{{$.inputs['leave_request[end_date]']}}"
                in: body
              - name: leave_request[half_start]
                value: "{{$.inputs['leave_request[half_start]']}}"
                in: body
              - name: leave_request[half_start_am_pm]
                value: "{{$.inputs['leave_request[half_start_am_pm]']}}"
                in: body
                condition: "{{present($.inputs['leave_request[half_start_am_pm]'])}}"
              - name: leave_request[half_end]
                value: "{{$.inputs['leave_request[half_end]']}}"
                in: body
                condition: "{{present($.inputs['leave_request[half_end]'])}}"
              - name: leave_request[half_end_am_pm]
                value: "{{$.inputs['leave_request[half_end_am_pm]']}}"
                in: body
                condition: "{{present($.inputs['leave_request[half_end_am_pm]'])}}"
              - name: leave_request[type]
                value: "{{$.inputs['leave_request[type]']}}"
                in: body
                condition: "{{present($.inputs['leave_request[type]'])}}"
              - name: leave_request[notes]
                value: "{{$.inputs['leave_request[notes]']}}"
                in: body
                condition: "{{present($.inputs['leave_request[notes]'])}}"
            response:
