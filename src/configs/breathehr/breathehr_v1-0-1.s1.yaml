StackOne: 1.0.0
info:
  title: BreatheHR
  key: breathehr
  version: 1.0.1
  assets:
    icon: https://stackone-logos.com/api/breathe/filled/png
  description: BreatheHR is a modern HR platform that helps companies streamline their hiring process.
baseUrl: https://api.breathehr.com/v1
authentication:
  - custom:
      type: custom
      label: Public API
      support:
        link: https://hub.stackone.com/connection-guides/hris/breathehr
        description: The steps in this guide require Admin privileges within BreatheHR.
      authorization:
        type: none
      configFields:
        - key: apiKey
          label: API Key
          type: password
          required: true
          secret: true
          placeholder: 7cef933f17737108009021191848635eb898b1b99cg2ffee227b577024ddfb2b
          description: You can generate an API Key in your BreatheHR account **Configure > Settings > Integrations > API Setup**.
      environments:
        - key: production
          name: Production
      testActions:
        - action: list_employees
          required: true
actions:
  - actionId: list_employees
    categories:
      - hris
    actionType: list
    schema: employees
    label: List Employees
    description: Get a list of employees
    details: "Returns a paginated list of all employees in the BreatheHR system. Supports filtering by department_id, location_id, division_id, employment_status, and pagination with page and per_page. Returns employee data including ID, first_name, last_name, email, employment_status, department, location, and other employee properties."
    inputs:
      - name: page
        description: Page of results to fetch.
        type: number
        in: query
        required: false
      - name: per_page
        description: Number of results to return per page.
        type: number
        in: query
        required: false
      - name: filter
        description: Type of employees to return
        type: string
        in: query
        required: false
      - name: rotacloud
        description: Return leave requests where rotacloud is not excluded from integration
        type: boolean
        in: query
        required: false
    steps:
      - stepId: get_all_employees
        description: Get employees request
        stepFunction:
          functionName: request
          parameters:
            url: /employees
            method: get
            args:
              - name: X-Api-Key
                value: $.credentials.apiKey
                in: headers
              - name: page
                value: '{{$.inputs.page}}'
                in: query
                condition: '{{present($.inputs.page)}}'
              - name: per_page
                value: '{{$.inputs.per_page}}'
                in: query
                condition: '{{present($.inputs.per_page)}}'
              - name: filter
                value: '{{$.inputs.filter}}'
                in: query
                condition: '{{present($.inputs.filter)}}'
              - name: rotacloud
                value: '{{$.inputs.rotacloud}}'
                in: query
                condition: '{{present($.inputs.rotacloud)}}'
            response:
              collection: true
    result:
      data: $.steps.get_all_employees.output.data
  - actionId: get_employee
    categories:
      - hris
    actionType: get
    schema: employees
    label: Get Employee
    description: Get a specific employee by ID
    details: "Returns detailed information for a specific employee by their ID. Includes employee ID, first_name, last_name, email, employment_status, department, location, division, job_title, start_date, and all other employee properties."
    inputs:
      - name: id
        description: The ID of the employee to retrieve.
        type: string
        in: path
        required: true
    steps:
      - stepId: get_an_employee
        description: Get employee request
        stepFunction:
          functionName: request
          parameters:
            url: /employees/${inputs.id}
            method: get
            args:
              - name: X-Api-Key
                value: $.credentials.apiKey
                in: headers
            response:
              collection: false
    result:
      data: $.steps.get_an_employee.output.data
  - actionId: list_employee_absences
    categories:
      - hris
    actionType: get
    label: Get Employee Absences
    description: Get absences for a specific employee by ID
    details: "Returns a paginated list of absences for a specific employee. Requires employee ID. Supports optional filtering to exclude cancelled absences and pagination with page and per_page parameters. Returns absence data including dates, reasons, and other absence properties."
    inputs:
      - name: id
        description: The ID of the employee whose absences to retrieve.
        type: string
        in: path
        required: true
      - name: exclude_cancelled_absences
        description: Don't return cancelled leave requests
        type: boolean
        in: query
        required: false
      - name: page
        description: Page of results to fetch.
        type: number
        in: query
        required: false
      - name: per_page
        description: Number of results to return per page.
        type: number
        in: query
        required: false
    steps:
      - stepId: get_employee_absences
        description: Get employee absences request
        stepFunction:
          functionName: request
          parameters:
            url: /employees/${inputs.id}/absences
            method: get
            args:
              - name: X-Api-Key
                value: $.credentials.apiKey
                in: headers
              - name: page
                value: '{{$.inputs.page}}'
                in: query
                condition: '{{present($.inputs.page)}}'
              - name: per_page
                value: '{{$.inputs.per_page}}'
                in: query
                condition: '{{present($.inputs.per_page)}}'
              - name: exclude_cancelled_absences
                value: '{{$.inputs.exclude_cancelled_absences}}'
                in: query
                condition: '{{present($.inputs.exclude_cancelled_absences)}}'
            response:
              collection: true
    result:
      data: $.steps.get_employee_absences.output.data
