- actionId: list_employees
  label: List Employees
  categories:
    - hris
  actionType: list
  description: Returns a paginated list of employees from BambooHR using the employee directory endpoint.
  details: Lists all employees with basic unified schema fields including ID, name, contact information, and employee number. Uses BambooHR's directory endpoint which returns a subset of fields. For full field detail including date of birth, address, and employment history, use get_employee.
  resources: https://documentation.bamboohr.com/reference/get-employees-list
  entrypointUrl: /employees/directory
  entrypointHttpMethod: get

  steps:
    - stepId: get_employees
      description: Fetch all employees from BambooHR employee directory
      stepFunction:
        functionName: request
        parameters:
          url: /employees/directory
          method: get
          args:
            - name: Accept
              value: application/json
              in: headers

    - stepId: map_employees_data
      description: Map employee directory fields to unified HRIS schema
      stepFunction:
        functionName: map_fields
        version: '2'
        parameters:
          fields:
            - targetFieldKey: id
              expression: $.id
              type: string
            - targetFieldKey: first_name
              expression: $.firstName
              type: string
            - targetFieldKey: last_name
              expression: $.lastName
              type: string
            - targetFieldKey: personal_email
              expression: $.homeEmail
              type: string
            - targetFieldKey: personal_phone_number
              expression: $.mobilePhone
              type: string
            - targetFieldKey: employee_number
              expression: $.employeeNumber
              type: string
            - targetFieldKey: title
              expression: $.jobTitle
              type: string
          dataSource: $.steps.get_employees.output.data.employees

    - stepId: typecast_employees_data
      description: Apply unified schema types to employee list data
      stepFunction:
        functionName: typecast
        version: '2'
        parameters:
          fields:
            - targetFieldKey: id
              type: string
            - targetFieldKey: first_name
              type: string
            - targetFieldKey: last_name
              type: string
            - targetFieldKey: personal_email
              type: string
            - targetFieldKey: personal_phone_number
              type: string
            - targetFieldKey: employee_number
              type: string
            - targetFieldKey: title
              type: string
          dataSource: $.steps.map_employees_data.output.data

  result:
    data: $.steps.typecast_employees_data.output.data

- actionId: get_employee
  label: Get Employee
  categories:
    - hris
  actionType: get
  description: Returns a single employee record by ID with full unified HRIS schema field mapping, including bank details and employment history.
  details: Makes three parallel-style API calls — main employee fields, directDeposit table for all bank accounts, and jobInfo table for full employment history — then combines them into a single unified response. Bank details and employment history are fetched as complete arrays in one call each. 404s on table endpoints are handled gracefully and return empty arrays.
  resources: https://documentation.bamboohr.com/reference/get-employee
  entrypointUrl: /employees/:id
  entrypointHttpMethod: get

  inputs:
    - name: id
      description: The unique identifier of the employee to retrieve
      type: string
      in: path
      required: true

  steps:
    - stepId: fetch_employee
      description: Fetch core employee fields from BambooHR
      stepFunction:
        functionName: request
        parameters:
          url: /employees/${inputs.id}
          method: get
          args:
            - name: Accept
              value: application/json
              in: headers
            - name: fields
              value: id,firstName,lastName,dateOfBirth,homeEmail,terminationDate,mobilePhone,hireDate,address1,address2,city,zipCode,country,employmentHistoryStatus,employeeNumber,maritalStatus,jobTitle,ssn
              in: query

    - stepId: fetch_bank_details
      description: Fetch all bank account (direct deposit) records for the employee
      stepFunction:
        functionName: request
        parameters:
          url: /employees/${inputs.id}/tables/directDeposit
          method: get
          args:
            - name: Accept
              value: application/json
              in: headers
          customErrors:
            - receivedStatus: 404
              targetStatus: 200
              message: No bank details found for this employee

    - stepId: fetch_employment_history
      description: Fetch full employment history (job info) records for the employee
      stepFunction:
        functionName: request
        parameters:
          url: /employees/${inputs.id}/tables/jobInfo
          method: get
          args:
            - name: Accept
              value: application/json
              in: headers
          customErrors:
            - receivedStatus: 404
              targetStatus: 200
              message: No employment history found for this employee

    - stepId: group_employee_data
      description: Combine core employee data, bank details, and employment history into a single object
      stepFunction:
        functionName: group_data
        parameters:
          stepsDataToGroup:
            - fetch_employee
            - fetch_bank_details
            - fetch_employment_history
          isSingleRecord: true

    - stepId: map_employee_data
      description: Map combined employee data to unified HRIS schema fields
      stepFunction:
        functionName: map_fields
        version: '2'
        parameters:
          dataSource: $.steps.group_employee_data.output.data
          fields:
            - targetFieldKey: id
              expression: $.fetch_employee.id
              type: string
            - targetFieldKey: first_name
              expression: $.fetch_employee.firstName
              type: string
            - targetFieldKey: last_name
              expression: $.fetch_employee.lastName
              type: string
            - targetFieldKey: date_of_birth
              expression: $.fetch_employee.dateOfBirth
              type: string
            - targetFieldKey: personal_email
              expression: $.fetch_employee.homeEmail
              type: string
            - targetFieldKey: termination_date
              expression: $.fetch_employee.terminationDate
              type: string
            - targetFieldKey: personal_phone_number
              expression: $.fetch_employee.mobilePhone
              type: string
            - targetFieldKey: start_date
              expression: $.fetch_employee.hireDate
              type: string
            - targetFieldKey: home_location
              type: object
              expression: |
                {
                  "street_1": $.fetch_employee.address1,
                  "street_2": $.fetch_employee.address2,
                  "city": $.fetch_employee.city,
                  "zip_code": $.fetch_employee.zipCode,
                  "country": $.fetch_employee.country
                }
            - targetFieldKey: employments
              type: object
              expression: $.fetch_employment_history.data
            - targetFieldKey: employee_number
              expression: $.fetch_employee.employeeNumber
              type: string
            - targetFieldKey: marital_status
              expression: $.fetch_employee.maritalStatus
              type: string
            - targetFieldKey: national_identity_numbers
              type: object
              expression: |
                [{
                  "value": $.fetch_employee.ssn,
                  "type": "ssn"
                }]
            - targetFieldKey: bank_details
              type: object
              expression: $.fetch_bank_details.data
            - targetFieldKey: title
              expression: $.fetch_employee.jobTitle
              type: string

    - stepId: typecast_employee_data
      description: Apply unified schema types to combined employee data
      stepFunction:
        functionName: typecast
        version: '2'
        parameters:
          dataSource: $.steps.map_employee_data.output.data
          fields:
            - targetFieldKey: id
              type: string
            - targetFieldKey: first_name
              type: string
            - targetFieldKey: last_name
              type: string
            - targetFieldKey: date_of_birth
              type: datetime_string
            - targetFieldKey: personal_email
              type: string
            - targetFieldKey: termination_date
              type: datetime_string
            - targetFieldKey: personal_phone_number
              type: string
            - targetFieldKey: start_date
              type: datetime_string
            - targetFieldKey: employee_number
              type: string
            - targetFieldKey: marital_status
              type: string
            - targetFieldKey: title
              type: string

  result:
    data: $.steps.typecast_employee_data.output.data

- actionId: create_employee
  label: Create Employee
  categories:
    - hris
  actionType: create
  description: Creates a new employee record in BambooHR.
  details: Creates a new employee with the provided personal and contact details. First name and last name are required. All other fields are optional and will only be sent if provided.
  resources: https://documentation.bamboohr.com/reference/post-employee
  entrypointUrl: /employees
  entrypointHttpMethod: post

  inputs:
    - name: first_name
      description: The employee's first name
      type: string
      in: body
      required: true
    - name: last_name
      description: The employee's last name
      type: string
      in: body
      required: true
    - name: date_of_birth
      description: The employee's date of birth in YYYY-MM-DD format
      type: datetime_string
      in: body
      required: false
    - name: personal_email
      description: The employee's personal email address
      type: string
      in: body
      required: false
    - name: personal_phone_number
      description: The employee's personal mobile phone number
      type: string
      in: body
      required: false
    - name: start_date
      description: The employee's hire date in YYYY-MM-DD format
      type: datetime_string
      in: body
      required: false
    - name: title
      description: The employee's job title
      type: string
      in: body
      required: false
    - name: employee_number
      description: The assigned employee number or ID
      type: string
      in: body
      required: false
    - name: marital_status
      description: The employee's marital status
      type: string
      in: body
      required: false
    - name: home_location
      description: The employee's home address details
      type: object
      in: body
      required: false
      properties:
        - name: street_1
          description: First line of the home address
          type: string
          required: false
        - name: street_2
          description: Second line of the home address
          type: string
          required: false
        - name: city
          description: City of the home address
          type: string
          required: false
        - name: zip_code
          description: ZIP or postal code of the home address
          type: string
          required: false
        - name: country
          description: Country of the home address
          type: string
          required: false

  steps:
    - stepId: create_employee
      description: Create new employee record in BambooHR
      stepFunction:
        functionName: request
        parameters:
          url: /employees
          method: post
          args:
            - name: Accept
              value: application/json
              in: headers
            - name: Content-Type
              value: application/json
              in: headers
            - name: firstName
              value: $.inputs.first_name
              in: body
            - name: lastName
              value: $.inputs.last_name
              in: body
            - name: dateOfBirth
              value: $.inputs.date_of_birth
              in: body
              condition: '{{present(inputs.date_of_birth)}}'
            - name: homeEmail
              value: $.inputs.personal_email
              in: body
              condition: '{{present(inputs.personal_email)}}'
            - name: mobilePhone
              value: $.inputs.personal_phone_number
              in: body
              condition: '{{present(inputs.personal_phone_number)}}'
            - name: hireDate
              value: $.inputs.start_date
              in: body
              condition: '{{present(inputs.start_date)}}'
            - name: jobTitle
              value: $.inputs.title
              in: body
              condition: '{{present(inputs.title)}}'
            - name: employeeNumber
              value: $.inputs.employee_number
              in: body
              condition: '{{present(inputs.employee_number)}}'
            - name: maritalStatus
              value: $.inputs.marital_status
              in: body
              condition: '{{present(inputs.marital_status)}}'
            - name: address1
              value: $.inputs.home_location.street_1
              in: body
              condition: '{{present(inputs.home_location.street_1)}}'
            - name: address2
              value: $.inputs.home_location.street_2
              in: body
              condition: '{{present(inputs.home_location.street_2)}}'
            - name: city
              value: $.inputs.home_location.city
              in: body
              condition: '{{present(inputs.home_location.city)}}'
            - name: zipCode
              value: $.inputs.home_location.zip_code
              in: body
              condition: '{{present(inputs.home_location.zip_code)}}'
            - name: country
              value: $.inputs.home_location.country
              in: body
              condition: '{{present(inputs.home_location.country)}}'

  result:
    message: Employee created successfully
    data:
      id: $.steps.create_employee.output.data.id

